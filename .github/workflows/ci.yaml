name: CI Pipeline

on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Trivy filesystem scan
              uses: aquasecurity/trivy-action@0.35.0  
              with:
                scan-type: fs
                scan-ref: .
                format: table
                severity: HIGH,CRITICAL
                exit-code: '0'

            - name: Build Docker Image
              run: |
                docker build \
                -t ${{secrets.DOCKERHUB_USERNAME}}/task-dashboard:latest \
                -t ${{secrets.DOCKERHUB_USERNAME}}/task-dashboard:${{github.sha}} \
                .

            - name: Login to Docker hub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKERHUB_USERNAME}}
                password: ${{secrets.DOCKERHUB_PASSWORD}}
            
            - name: Push latest and SHA tagged Image
              run: |
                docker push ${{secrets.DOCKERHUB_USERNAME}}/task-dashboard:latest 
                docker push ${{secrets.DOCKERHUB_USERNAME}}/task-dashboard:${{github.sha}}
            

            - name: Update GitOps Repository
              env:
                GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
                GITOPS_REPO: YOUR_USERNAME/task-dashboard-gitops
                IMAGE_TAG: ${{ github.sha }}

              run: |
                git clone https://x-access-token:${GITOPS_TOKEN}@github.com/${GITOPS_REPO}.git gitops

                cd gitops

                sed -i "s|image: .*task-dashboard:.*|image: debnildocker/task-dashboard:${IMAGE_TAG}|" k8s/deployment.yaml

                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

                git add k8s/deployment.yaml

                git commit -m "Update task-dashboard image to ${IMAGE_TAG}" || echo "No changes to commit"

                git push
            - name: Trivy Image Scan
              uses: aquasecurity/trivy-action@0.35.0
              with:
                image-ref: ${{secrets.DOCKERHUB_USERNAME}}/task-dashboard:latest
                format: table
                severity: HIGH,CRITICAL
                exit-code: '0'
