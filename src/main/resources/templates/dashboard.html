<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>DevOps Task Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body class="bg-light">

<div class="container-fluid py-4 px-5">

    <!-- ================= Header ================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">
                <i class="bi bi-kanban-fill text-primary"></i>
                DevOps Task Dashboard
            </h2>

            <small class="text-muted">
                Spring Boot • Docker • Kubernetes • GitHub Actions
            </small>
        </div>

        <div>

            <button class="btn btn-outline-secondary me-2" id="refreshBtn">

                <i class="bi bi-arrow-clockwise"></i>

                Refresh

            </button>

            <button class="btn btn-primary" id="addTaskBtn">

                <i class="bi bi-plus-circle"></i>

                Add Task

            </button>

        </div>

    </div>

    <!-- ================= Dashboard Cards ================= -->

    <div class="row g-4 mb-4">

       <div class="col-xl-3 col-md-6">

    <div class="card shadow-sm h-100">

        <div class="card-body d-flex justify-content-between">

            <div>

                <h6>Total Tasks</h6>

                <h2 id="totalTasks">0</h2>

            </div>

            <div class="display-5 text-primary">

                <i class="bi bi-list-task"></i>

            </div>

        </div>

    </div>

</div>

        <div class="col-xl-3 col-md-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h6 class="text-muted">Pending</h6>

                    <h2 class="text-warning" id="pendingTasks">0</h2>

                </div>

            </div>

        </div>

        <div class="col-xl-3 col-md-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h6 class="text-muted">Running</h6>

                    <h2 class="text-primary" id="runningTasks">0</h2>

                </div>

            </div>

        </div>

        <div class="col-xl-3 col-md-6">

            <div class="card shadow-sm border-0 h-100">

                <div class="card-body">

                    <h6 class="text-muted">Completed</h6>

                    <h2 class="text-success" id="completedTasks">0</h2>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= Task Table ================= -->

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="row mb-4">

                <div class="col-md-6">

                    <input
                            type="text"
                            id="searchBox"
                            class="form-control"
                            placeholder="Search Tasks...">

                </div>

                <div class="col-md-3">

                    <select
                            class="form-select"
                            id="statusFilter">

                        <option value="">All Status</option>

                        <option value="Pending">Pending</option>

                        <option value="Running">Running</option>

                        <option value="Completed">Completed</option>

                    </select>

                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-dark">

                    <tr>

                        <th>ID</th>

                        <th>Title</th>

                        <th>Description</th>

                        <th>Priority</th>

                        <th>Status</th>

                        <th>Created</th>

                        <th width="140">Actions</th>

                    </tr>

                    </thead>

                    <tbody id="taskTableBody">

                    <!-- JavaScript will populate this -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- ================= Add/Edit Modal ================= -->

<div class="modal fade"
     id="taskModal"
     tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Task Details

                </h5>

                <button
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <form id="taskForm">

                    <input
                            type="hidden"
                            id="taskId">

                    <div class="mb-3">

                        <label class="form-label">

                            Title

                        </label>

                        <input
                                type="text"
                                id="title"
                                class="form-control"
                                required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Description

                        </label>

                        <textarea
                                class="form-control"
                                id="description"
                                rows="3">
                        </textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">

                                Priority

                            </label>

                            <select
                                    id="priority"
                                    class="form-select">

                                <option>High</option>

                                <option>Medium</option>

                                <option>Low</option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Status

                            </label>

                            <select
                                    id="status"
                                    class="form-select">

                                <option>Pending</option>

                                <option>Running</option>

                                <option>Completed</option>

                            </select>

                        </div>

                    </div>

<div class="modal-footer">
<button class="btn btn-primary" id="saveTaskBtn" type="submit">
    Save Task
</button>
                <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>


            </div>
                </form>

            </div>

        </div>

    </div>

</div>

<!-- ================= Delete Confirmation ================= -->

<div class="modal fade"
     id="deleteModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">

                    Delete Task

                </h5>

            </div>

            <div class="modal-body">

                Are you sure you want to delete this task?

            </div>

            <div class="modal-footer">

                <button
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                        class="btn btn-danger"
                        id="confirmDeleteBtn">

                    Delete

                </button>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom JS -->

<script th:src="@{/js/app.js}"></script>

</body>

</html>
